bundle:
  name: ml-deployment-course

sync:
  # Course material is git-ignored (not published to GitHub) but must still sync to Databricks
  include:
    - week*/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Host comes from this ~/.databrickscfg profile (created with `databricks auth login`)
      profile: azure-ml
