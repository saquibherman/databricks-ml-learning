bundle:
  name: ml-deployment-course

# Machine-specific settings (workspace host), git-ignored. The VS Code Databricks extension
# needs workspace.host and fails with "Invalid host name" without it.
include:
  - databricks.local*.yml

sync:
  # Course material is git-ignored (not published to GitHub) but must still sync to Databricks
  include:
    - week*/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Profile in ~/.databrickscfg (created with `databricks auth login`). The workspace host
      # lives in the git-ignored databricks.local.yml, written by setup.sh.
      profile: azure-ml
